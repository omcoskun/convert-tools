name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  javascript:
    name: JavaScript (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both LTS lines. The app's render tests need module.registerHooks
        # (Node 22.15 or later).
        node: ["22.23.4", "24.22.2"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Core tests
        run: npm run test:core

      - name: App tests
        run: npm run test:app

      - name: Build core and demo
        run: npm run build

      - name: Package smoke test
        run: npm run test:pack

  java:
    name: Java
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build package
        run: mvn --batch-mode --file packages/core-java/pom.xml package

      # javac --release 17 -Xlint:all -Werror, then ContractTest,
      # CoordinateContractTest, ReferenceVectorTest and ErrorContractTest
      # against contracts/test-vectors.
      - name: Contract checks
        run: sh packages/core-java/scripts/test.sh
